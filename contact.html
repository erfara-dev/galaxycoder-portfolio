<body id="top" data-page="contact">
<a class="skip-link" href="#main">Skip to main content</a>
<span data-site-icons></span><div data-site-header></div>
<main id="main">
<section class="section" id="contact" aria-labelledby="contact-title">
  <div class="container contact">
    <div class="reveal">
      <p class="eyebrow"><span class="eyebrow__index">05</span><span>Contact</span></p>
      <h2 class="contact__title" id="contact-title">Let's build something together.</h2>
      <p class="lead">Have an idea for a website, want to collaborate, or just want to talk about learning to build for the web? Send a message and I'll get back to you.</p>
      <div class="contact__list">
        <div><span class="contact__label">Email</span><a class="contact__email" href="mailto:ditoerff@gmail.com">ditoerff@gmail.com</a></div>
        <div><span class="contact__label">Social</span>
          <div class="social-list">
            <a class="icon-btn" href="https://github.com/erfara-dev" target="_blank" rel="noopener noreferrer" aria-label="GitHub (opens in a new tab)"><svg class="icon icon--fill" aria-hidden="true" focusable="false"><use href="#i-github"/></svg></a>
            <a class="icon-btn" href="https://linkedin.com/in/ditoerfana" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)"><svg class="icon icon--fill" aria-hidden="true" focusable="false"><use href="#i-linkedin"/></svg></a>
            <a class="icon-btn" href="mailto:ditoerff@gmail.com" aria-label="Email Dito"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-mail"/></svg></a>
          </div>
        </div>
      </div>
    </div>
    <div class="form-card reveal" style="--i:1">
      <form class="form" id="contact-form" novalidate>
        <div class="form__row">
          <div class="field">
            <label for="first_name">First name <span class="req" aria-hidden="true">*</span></label>
            <input id="first_name" name="first_name" type="text" autocomplete="given-name" required aria-required="true" aria-describedby="err-first_name">
            <p class="field__error" id="err-first_name"></p>
          </div>
          <div class="field">
            <label for="last_name">Last name</label>
            <input id="last_name" name="last_name" type="text" autocomplete="family-name" aria-describedby="err-last_name">
            <p class="field__error" id="err-last_name"></p>
          </div>
        </div>
        <div class="field">
          <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-required="true" aria-describedby="err-email">
          <p class="field__error" id="err-email"></p>
        </div>
        <div class="field">
          <label for="subject">Subject <span class="req" aria-hidden="true">*</span></label>
          <select id="subject" name="subject" required aria-required="true" aria-describedby="err-subject">
            <option value="">Choose a subject…</option>
            <option>General inquiry</option>
            <option>Project opportunity</option>
            <option>Collaboration</option>
            <option>Other</option>
          </select>
          <p class="field__error" id="err-subject"></p>
        </div>
        <div class="field">
          <label for="message">Message <span class="req" aria-hidden="true">*</span></label>
          <textarea id="message" name="message" required aria-required="true" aria-describedby="err-message" placeholder="Tell me about your idea or project…"></textarea>
          <p class="field__error" id="err-message"></p>
        </div>
        <div class="hp-field" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <div id="form-status" class="form-status" aria-live="polite"></div>
        <div class="form__actions">
          <button class="btn btn--primary" type="submit"><span class="spinner" aria-hidden="true"></span><span class="btn__label">Send message</span><span class="btn__icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-send"/></svg></span></button>
        </div>
      </form>
    </div>
  </div>
</section>
